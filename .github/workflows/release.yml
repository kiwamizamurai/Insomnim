name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: jiro4989/setup-nim-action@v2
        with:
          nim-version: "stable"

      - run: nim --version

      - name: Run unit tests
        run: nimble -y test

      - name: Build CLI
        run: nimble -y release

      - name: Build GUI (fetches the darwin package)
        run: nimble -y gui

      # Ad-hoc codesigned only (codesign --sign -); no Developer ID / notarization
      # since this is a personal OSS project without an Apple Developer account.
      - name: Package .app
        run: nimble -y app

      - name: Compress artifacts
        run: |
          tar -czf insomnim-cli-macos-arm64.tar.gz -C bin insomnim
          (cd dist && zip -r ../Insomnim-macos-arm64.app.zip Insomnim.app)

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            insomnim-cli-macos-arm64.tar.gz
            Insomnim-macos-arm64.app.zip
